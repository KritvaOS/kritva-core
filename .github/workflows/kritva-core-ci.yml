name: Kritva Core CI

on:
  push:
  pull_request:

jobs:
  kritva-core-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Test
        run: |
          cd build
          ctest --output-on-failure
