name: Source Header Check

on:
  push:
  pull_request:

jobs:
  source-header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check source headers
        run: python3 scripts/lint/check_source_headers.py --mode tracked --strict
