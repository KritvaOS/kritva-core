name: contract-pin-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-pin-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for the pinned commit)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check contract against its pin
        run: python3 scripts/contract/check_contract_pin.py --verify-git
